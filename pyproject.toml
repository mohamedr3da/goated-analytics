[project]
name = "x-discord-analytics-bot"
version = "0.1.0"
description = "Discord bot foundation for tracking X/Twitter account analytics over time."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.13,<2",
    "discord.py>=2.4,<3",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.4,<3",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[project.scripts]
x-discord-analytics-bot = "bot.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

